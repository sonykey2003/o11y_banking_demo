# ─────────────────────────────────────────────────────────────────────────────
# secret-mysql.example.yaml — EXAMPLE ONLY: placeholders, NOT real credentials.
#
# Create the real secret (do NOT commit real values):
#
#   kubectl -n sea-bank-demo create secret generic sea-bank-mysql \
#     --from-literal=root-password='<ROOT_PW>' \
#     --from-literal=username='bankapp' \
#     --from-literal=password='<APP_PW>'
#
# Keys:
#   root-password  MySQL root password (init only)
#   username       Application DB user (default: bankapp) — used by account/transfer services
#   password       Application DB user password
#
# The Splunk DBMon monitoring user (`otel`) is created separately by
# scripts/splunk-dbmon.sh prep (its password stays out of git).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: sea-bank-mysql
  namespace: sea-bank-demo
type: Opaque
stringData:
  root-password: REPLACE_ME_ROOT
  username: bankapp
  password: REPLACE_ME_APP
